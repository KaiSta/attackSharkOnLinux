# Dependabot version updates. Security updates are enabled in the repository
# settings, not here; this file only schedules routine version bumps.
#
# Both ecosystems group their minor and patch bumps into one pull request. A
# major version is left on its own, because it needs to be read against the
# changelog rather than approved as part of a batch.
version: 2
updates:
  # go.mod and go.sum: fyne.io/systray, godbus/dbus and golang.org/x/sys.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The actions pinned in .github/workflows/ci.yml and release.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
